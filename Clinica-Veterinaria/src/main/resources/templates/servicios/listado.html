<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/base :: cabeceraBase('Servicios')}"></head>
    <body>
        <header th:replace="~{fragmentos/componentes :: encabezadoClinica}"></header>
        <nav th:replace="~{fragmentos/componentes :: barraNavegacion}"></nav>
        <div th:replace="~{fragmentos/componentes :: avisoEmergente}"></div>

        <main class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Servicios veterinarios</h2>
                <button type="button" class="btn btn-clinica"
                        data-bs-toggle="modal" data-bs-target="#modalAgregarServicio">
                    <i class="fa-solid fa-plus"></i> Agregar servicio
                </button>
            </div>

            <table class="table table-striped table-hover align-middle bg-white shadow-sm">
                <thead class="table-success">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th class="text-end">Precio</th>
                        <th class="text-center">Duración</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="servicio : ${listaServicios}">
                        <td th:text="${servicio.id}">1</td>
                        <td th:text="${servicio.nombre}">Nombre</td>
                        <td th:text="${servicio.tipoServicio.nombre}">Tipo</td>
                        <td class="text-end" th:text="${'₡' + #numbers.formatDecimal(servicio.precio, 1, 'POINT', 2, 'COMMA')}">₡0</td>
                        <td class="text-center" th:text="${servicio.duracionMinutos + ' min'}">30 min</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-success"
                               th:href="@{/servicios/modifica/{id}(id=${servicio.id})}">
                                <i class="fa-solid fa-pen"></i> Editar
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal" data-bs-target="#modalEliminarServicio"
                                    th:attr="data-id=${servicio.id},data-nombre=${servicio.nombre}">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaServicios)}">
                        <td colspan="6" class="text-center text-muted">No hay servicios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </main>

        <!-- Modal agregar -->
        <div class="modal fade" id="modalAgregarServicio" tabindex="-1">
            <div class="modal-dialog">
                <form class="modal-content" th:action="@{/servicios/guardar}" th:object="${servicioNuevo}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Agregar servicio</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="nombreNuevo">Nombre</label>
                            <input type="text" id="nombreNuevo" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="tipoNuevo">Tipo de servicio</label>
                            <select id="tipoNuevo" class="form-select" name="tipoServicio.id" required>
                                <option value="">Seleccioná un tipo...</option>
                                <option th:each="tipo : ${listaTipos}"
                                        th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label" for="precioNuevo">Precio</label>
                                <input type="number" step="0.01" min="0.01" id="precioNuevo"
                                       class="form-control" th:field="*{precio}" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label" for="duracionNueva">Duración (min)</label>
                                <input type="number" min="1" id="duracionNueva"
                                       class="form-control" th:field="*{duracionMinutos}" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-clinica">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal confirmar eliminación -->
        <div class="modal fade" id="modalEliminarServicio" tabindex="-1">
            <div class="modal-dialog">
                <form class="modal-content" th:action="@{/servicios/eliminar}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirmar eliminación</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>¿Seguro que querés eliminar el servicio <strong id="nombreServicioEliminar"></strong>?</p>
                        <input type="hidden" name="idServicio" id="idServicioEliminar">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{fragmentos/componentes :: piePagina}"></footer>
        <th:block th:replace="~{fragmentos/base :: scriptsBase}"></th:block>
        <script>
            document.getElementById('modalEliminarServicio').addEventListener('show.bs.modal', function (e) {
                var boton = e.relatedTarget;
                document.getElementById('idServicioEliminar').value = boton.getAttribute('data-id');
                document.getElementById('nombreServicioEliminar').textContent = boton.getAttribute('data-nombre');
            });
        </script>
    </body>
</html>
