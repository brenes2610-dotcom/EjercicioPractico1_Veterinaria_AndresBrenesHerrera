<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/base :: cabeceraBase('Tipos de servicio')}"></head>
    <body>
        <header th:replace="~{fragmentos/componentes :: encabezadoClinica}"></header>
        <nav th:replace="~{fragmentos/componentes :: barraNavegacion}"></nav>
        <div th:replace="~{fragmentos/componentes :: avisoEmergente}"></div>

        <main class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Tipos de servicio</h2>
                <button type="button" class="btn btn-clinica"
                        data-bs-toggle="modal" data-bs-target="#modalAgregarTipo">
                    <i class="fa-solid fa-plus"></i> Agregar tipo
                </button>
            </div>

            <table class="table table-striped table-hover align-middle bg-white shadow-sm">
                <thead class="table-success">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th class="text-center">Servicios</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tipo : ${listaTipos}">
                        <td th:text="${tipo.id}">1</td>
                        <td th:text="${tipo.nombre}">Nombre</td>
                        <td th:text="${tipo.descripcion}">Descripción</td>
                        <td class="text-center">
                            <span class="badge text-bg-secondary"
                                  th:text="${#lists.size(tipo.serviciosAsociados)}">0</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-success"
                               th:href="@{/tipos/modifica/{id}(id=${tipo.id})}">
                                <i class="fa-solid fa-pen"></i> Editar
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal" data-bs-target="#modalEliminarTipo"
                                    th:attr="data-id=${tipo.id},data-nombre=${tipo.nombre}">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaTipos)}">
                        <td colspan="5" class="text-center text-muted">No hay tipos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </main>

        <!-- Modal agregar -->
        <div class="modal fade" id="modalAgregarTipo" tabindex="-1">
            <div class="modal-dialog">
                <form class="modal-content" th:action="@{/tipos/guardar}" th:object="${tipoNuevo}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Agregar tipo de servicio</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="nombreNuevo">Nombre</label>
                            <input type="text" id="nombreNuevo" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="descripcionNueva">Descripción</label>
                            <input type="text" id="descripcionNueva" class="form-control" th:field="*{descripcion}">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-clinica">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal confirmar eliminación -->
        <div class="modal fade" id="modalEliminarTipo" tabindex="-1">
            <div class="modal-dialog">
                <form class="modal-content" th:action="@{/tipos/eliminar}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirmar eliminación</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>¿Seguro que querés eliminar el tipo <strong id="nombreTipoEliminar"></strong>?</p>
                        <input type="hidden" name="idTipo" id="idTipoEliminar">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{fragmentos/componentes :: piePagina}"></footer>
        <th:block th:replace="~{fragmentos/base :: scriptsBase}"></th:block>
        <script>
            document.getElementById('modalEliminarTipo').addEventListener('show.bs.modal', function (e) {
                var boton = e.relatedTarget;
                document.getElementById('idTipoEliminar').value = boton.getAttribute('data-id');
                document.getElementById('nombreTipoEliminar').textContent = boton.getAttribute('data-nombre');
            });
        </script>
    </body>
</html>
